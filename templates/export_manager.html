<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTERS - Batch Export & Sync Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .text-amber-custom { color: #ffb703 !important; }
        .card-custom { background-color: #111; border: 1px solid #333; }
        .table-dark { --bs-table-bg: #111; }
        .form-check-input:checked { background-color: #ffb703; border-color: #ffb703; }
        .result-select {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .result-select:focus {
            background-color: #222;
            color: #fff;
            border-color: #ffb703;
            box-shadow: none;
        }
        .badge-storage {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.35em 0.65em;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="/" class="btn btn-outline-light btn-sm mb-2">← BACK TO PORTAL</a>
                <h2 class="fw-bold text-amber-custom" style="font-family: 'Cinzel', serif;">EXPORT & SYNC MANAGER</h2>
                <p class="text-white-50 small mb-0">Manage screening results, sync local storage & database records, and export printable DOH checklists.</p>
            </div>
            <div class="d-flex gap-2">
                <button id="btn-sync-unpushed" class="btn btn-outline-warning fw-bold px-3">
                    🔄 SYNC ALL UNPUSHED (<span id="unsynced-count">0</span>)
                </button>
                <button id="btn-trigger-batch" class="btn fw-bold px-4" style="background-color: #ffb703; color: #000;">
                    🖨️ EXPORT SELECTED (<span id="selected-count">0</span>)
                </button>
            </div>
        </div>

        <div class="card card-custom">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0 align-middle">
                        <thead>
                            <tr class="border-bottom border-secondary">
                                <th class="py-3 px-3" style="width: 40px;">
                                    <input class="form-check-input" type="checkbox" id="select-all-records">
                                </th>
                                <th class="py-3 px-3 text-amber-custom">SYNC STATUS</th>
                                <th class="py-3 px-3 text-amber-custom">STORAGE REMARKS</th>
                                <th class="py-3 px-3 text-amber-custom">TEST DATE</th>
                                <th class="py-3 px-3 text-amber-custom">UIC KEY</th>
                                <th class="py-3 px-3 text-amber-custom" style="width: 210px;">LINKAGE RESULT</th>
                                <th class="py-3 px-3 text-end text-amber-custom">ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="export-table-body">
                            <tr>
                                <td colspan="7" class="py-4 text-center text-white-50">Loading master records...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatUICDate(dateString) {
            if (!dateString) return "00000000";
            const parts = dateString.split('-');
            return parts.length === 3 ? `${parts[1]}${parts[2]}${parts[0]}` : "00000000";
        }

        function formatBirthOrder(orderVal) {
            return orderVal ? String(orderVal).trim().padStart(2, '0') : "01";
        }

        // --- LOCAL STORAGE HELPERS ---
        function getLocalStorageRecords() {
            try {
                const raw = localStorage.getItem('offline_hts_records') || '[]';
                return JSON.parse(raw);
            } catch (e) {
                return [];
            }
        }

        function saveLocalStorageRecords(records) {
            localStorage.setItem('offline_hts_records', JSON.stringify(records));
        }

        // --- UPDATE LINKAGE RESULT BY UIC KEY ---
        async function updateResultByUIC(uicKey, newResult, isLocalStorage, localIndex = null) {
            if (!uicKey || !newResult) return;

            // Update in Local Storage if record exists locally
            if (isLocalStorage && localIndex !== null) {
                const localRecords = getLocalStorageRecords();
                if (localRecords[localIndex]) {
                    localRecords[localIndex].linkage_result = newResult;
                    saveLocalStorageRecords(localRecords);
                    console.log(`[LocalStorage] Updated UIC ${uicKey} to result: ${newResult}`);
                }
            }

            // Update in Backend Database (SQLite & Firestore) via UIC API
            try {
                const response = await fetch(`/api/records/uic/${uicKey}/update-linkage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ linkage_result: newResult })
                });
                const resData = await response.json();
                if (resData.status === 'success') {
                    console.log(`[Server] Updated UIC ${uicKey} to result: ${newResult}`);
                }
            } catch (err) {
                console.error("UIC Linkage Update Error:", err);
            }
        }

        // --- PUSH INDIVIDUAL LOCAL RECORD TO SERVER ---
        async function syncSingleLocalRecord(index) {
            const localRecords = getLocalStorageRecords();
            const item = localRecords[index];

            if (!item) return false;

            try {
                const response = await fetch('/api/sqlite/save-offline', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(item)
                });
                const data = await response.json();

                if (data.status === 'success') {
                    // Remove synced item from Local Storage
                    localRecords.splice(index, 1);
                    saveLocalStorageRecords(localRecords);
                    return true;
                }
            } catch (err) {
                console.error("Single Sync Error:", err);
            }
            return false;
        }

        async function loadRecords() {
            const tableBody = document.getElementById('export-table-body');
            const unsyncedSpan = document.getElementById('unsynced-count');

            try {
                // Fetch Backend Records
                const res = await fetch('/api/my-hts-records');
                const serverRecords = await res.json() || [];

                // Fetch Browser LocalStorage
                const localStorageRecords = getLocalStorageRecords();

                if (serverRecords.length === 0 && localStorageRecords.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="7" class="py-4 text-center text-white-50">No intake records available.</td></tr>';
                    unsyncedSpan.innerText = '0';
                    return;
                }

                tableBody.innerHTML = '';
                let unsyncedCounter = 0;

                // 1. RENDER LOCAL STORAGE RECORDS (UNSYNCED)
                localStorageRecords.forEach((item, index) => {
                    unsyncedCounter++;
                    
                    let uic = item.uic;
                    if (!uic) {
                        const mCode = (item.mother_code || '').toUpperCase();
                        const fCode = (item.father_code || '').toUpperCase();
                        const bOrder = formatBirthOrder(item.birth_order);
                        const bDate = formatUICDate(item.birth_date);
                        uic = `${mCode}${fCode}${bOrder}${bDate}`;
                        item.uic = uic;
                    }

                    const currentResult = item.linkage_result || item.result || '';
                    const syncBadge = '<span class="badge bg-warning text-dark">UNSYNCED</span>';
                    const storageRemark = '<span class="badge bg-danger text-white badge-storage">🌐 Browser Local Storage</span>';

                    const tr = document.createElement('tr');
                    tr.className = 'border-bottom border-secondary';
                    tr.innerHTML = `
                        <td class="px-3"><input class="form-check-input record-checkbox" type="checkbox" value="local_${index}" disabled></td>
                        <td class="px-3">${syncBadge}</td>
                        <td class="px-3">${storageRemark}</td>
                        <td class="px-3 font-monospace">${item.test_date || 'N/A'}</td>
                        <td class="px-3 fw-bold text-amber-custom font-monospace">${uic}</td>
                        <td class="px-3">
                            <select class="form-select form-select-sm result-select" data-uic="${uic}" data-local="true" data-index="${index}">
                                <option value="" ${!currentResult ? 'selected' : ''}>PENDING EVALUATION</option>
                                <option value="NONREACTIVE" ${currentResult === 'NONREACTIVE' ? 'selected' : ''}>NONREACTIVE</option>
                                <option value="REACTIVE" ${currentResult === 'REACTIVE' ? 'selected' : ''}>REACTIVE</option>
                                <option value="INVALID" ${currentResult === 'INVALID' ? 'selected' : ''}>INVALID</option>
                            </select>
                        </td>
                        <td class="px-3 text-end">
                            <button class="btn btn-sm btn-warning fw-bold btn-sync-single" data-index="${index}">Sync Now</button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });

                // 2. RENDER DATABASE RECORDS (SQLITE & FIRESTORE)
                // Render Database Records (SQLite & Cloud Firestore)
serverRecords.forEach(record => {
    const data = record.data || {};
    const id = record.id;
    const isSynced = record.is_synced;
    const isFirebase = record.source === 'Firebase Cloud';
    const currentResult = data.linkage_result || data.result || '';

    if (!isSynced) unsyncedCounter++;

    let uic = data.uic;
    if (!uic) {
        const mCode = (data.mother_code || '').toUpperCase();
        const fCode = (data.father_code || '').toUpperCase();
        const bOrder = formatBirthOrder(data.birth_order);
        const bDate = formatUICDate(data.birth_date);
        uic = `${mCode}${fCode}${bOrder}${bDate}`;
    }

    const syncBadge = isSynced 
        ? '<span class="badge bg-success">CLOUD SYNCED</span>' 
        : '<span class="badge bg-warning text-dark">UNSYNCED</span>';

    // Highlight Firebase Cloud vs SQLite Local Storage
    const storageRemark = isFirebase
        ? '<span class="badge bg-primary text-white badge-storage">🔥 Firebase Cloud Log</span>'
        : (isSynced
            ? '<span class="badge bg-info text-dark badge-storage">💾 Cloud Database</span>'
            : '<span class="badge bg-secondary text-white badge-storage">📁 Local Database (SQLite)</span>');

    const tr = document.createElement('tr');
    tr.className = 'border-bottom border-secondary';
    tr.innerHTML = `
        <td class="px-3"><input class="form-check-input record-checkbox" type="checkbox" value="${id}"></td>
        <td class="px-3">${syncBadge}</td>
        <td class="px-3">${storageRemark}</td>
        <td class="px-3 font-monospace">${data.test_date || 'N/A'}</td>
        <td class="px-3 fw-bold text-amber-custom font-monospace">${uic}</td>
        <td class="px-3">
            <select class="form-select form-select-sm result-select" data-uic="${uic}" data-local="false">
                <option value="" ${!currentResult ? 'selected' : ''}>PENDING EVALUATION</option>
                <option value="NONREACTIVE" ${currentResult === 'NONREACTIVE' ? 'selected' : ''}>NONREACTIVE</option>
                <option value="REACTIVE" ${currentResult === 'REACTIVE' ? 'selected' : ''}>REACTIVE</option>
                <option value="INVALID" ${currentResult === 'INVALID' ? 'selected' : ''}>INVALID</option>
            </select>
        </td>
        <td class="px-3 text-end">
            <a href="/records/${id}/export" target="_blank" class="btn btn-sm btn-outline-warning">Print PDF</a>
        </td>
    `;
    tableBody.appendChild(tr);
});

                unsyncedSpan.innerText = unsyncedCounter;

                // Event Listeners for Result Dropdowns (Mapped by UIC)
                document.querySelectorAll('.result-select').forEach(select => {
                    select.addEventListener('change', (e) => {
                        const uicKey = e.target.getAttribute('data-uic');
                        const newResult = e.target.value;
                        const isLocal = e.target.getAttribute('data-local') === 'true';
                        const localIndex = isLocal ? parseInt(e.target.getAttribute('data-index'), 10) : null;

                        updateResultByUIC(uicKey, newResult, isLocal, localIndex);
                    });
                });

                // Individual Sync Button Event Listeners
                document.querySelectorAll('.btn-sync-single').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const idx = parseInt(e.target.getAttribute('data-index'), 10);
                        btn.disabled = true;
                        btn.innerText = 'Syncing...';

                        const success = await syncSingleLocalRecord(idx);
                        if (success) {
                            alert("Record successfully pushed to database!");
                        } else {
                            alert("Sync failed. Check network connection.");
                        }
                        loadRecords();
                    });
                });

                // Checkbox Selection Counters
                const checkboxes = document.querySelectorAll('.record-checkbox');
                function updateCounter() {
                    document.getElementById('selected-count').innerText = document.querySelectorAll('.record-checkbox:checked').length;
                }

                checkboxes.forEach(cb => cb.addEventListener('change', updateCounter));

                document.getElementById('select-all-records').onclick = (e) => {
                    checkboxes.forEach(cb => {
                        if (!cb.disabled) cb.checked = e.target.checked;
                    });
                    updateCounter();
                };

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = '<tr><td colspan="7" class="py-4 text-center text-danger">Failed to load intake records.</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadRecords();

            // Sync All Unpushed Button Action
            document.getElementById('btn-sync-unpushed').addEventListener('click', async () => {
                if (!navigator.onLine) {
                    alert("Cannot sync: Internet connection unavailable.");
                    return;
                }

                // 1. Sync all LocalStorage records
                const localRecords = getLocalStorageRecords();
                if (localRecords.length > 0) {
                    for (let i = localRecords.length - 1; i >= 0; i--) {
                        await syncSingleLocalRecord(i);
                    }
                }

                // 2. Sync SQLite pending records
                try {
                    const res = await fetch('/api/sqlite/sync-pending', { method: 'POST' });
                    const result = await res.json();
                    alert(`Sync Complete! ${result.synced_count || 0} unsynced records pushed to Firebase.`);
                    loadRecords();
                } catch (err) {
                    alert("Sync process completed.");
                    loadRecords();
                }
            });

            // Batch Export Button Action
            document.getElementById('btn-trigger-batch').addEventListener('click', () => {
                const selectedIds = Array.from(document.querySelectorAll('.record-checkbox:checked')).map(cb => cb.value);
                if (selectedIds.length === 0) {
                    alert("Please select at least one record to print.");
                    return;
                }
                window.open(`/records/batch/export?ids=${selectedIds.join(',')}`, '_blank');
            });
        });
    </script>
</body>
</html>
