<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTERS - Batch Export & Sync Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .text-amber-custom { color: #ffb703 !important; }
        .card-custom { background-color: #111; border: 1px solid #333; }
        .table-dark { --bs-table-bg: #111; }
        .form-check-input:checked { background-color: #ffb703; border-color: #ffb703; }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="/hts-form" class="btn btn-outline-light btn-sm mb-2">← BACK TO INTAKE FORM</a>
                <h2 class="fw-bold text-amber-custom" style="font-family: 'Cinzel', serif;">EXPORT & SYNC MANAGER</h2>
                <p class="text-white-50 small mb-0">View synced vs unsynced SQLite records and compile printable DOH checklists.</p>
            </div>
            <div class="d-flex gap-2">
                <button id="btn-sync-unpushed" class="btn btn-outline-warning fw-bold px-3">
                    🔄 SYNC UNPUSHED (<span id="unsynced-count">0</span>)
                </button>
                <button id="btn-trigger-batch" class="btn fw-bold px-4" style="background-color: #ffb703; color: #000;">
                    🖨️ EXPORT SELECTED (<span id="selected-count">0</span>)
                </button>
            </div>
        </div>

        <div class="card card-custom">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0 align-middle">
                        <thead>
                            <tr class="border-bottom border-secondary">
                                <th class="py-3 px-4" style="width: 50px;">
                                    <input class="form-check-input" type="checkbox" id="select-all-records">
                                </th>
                                <th class="py-3 px-4 text-amber-custom">SYNC STATUS</th>
                                <th class="py-3 px-4 text-amber-custom">TEST DATE</th>
                                <th class="py-3 px-4 text-amber-custom">UIC KEY</th>
                                <th class="py-3 px-4 text-amber-custom">RESULT STATUS</th>
                                <th class="py-3 px-4 text-end text-amber-custom">ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="export-table-body">
                            <tr>
                                <td colspan="6" class="py-4 text-center text-white-50">Loading master records...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatUICDate(dateString) {
            if (!dateString) return "00000000";
            const parts = dateString.split('-');
            return parts.length === 3 ? `${parts[1]}${parts[2]}${parts[0]}` : "00000000";
        }

        function formatBirthOrder(orderVal) {
            return orderVal ? String(orderVal).trim().padStart(2, '0') : "01";
        }

        async function loadRecords() {
            const tableBody = document.getElementById('export-table-body');
            const unsyncedSpan = document.getElementById('unsynced-count');

            try {
                const res = await fetch('/api/my-hts-records');
                const records = await res.json();

                if (!records || records.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="6" class="py-4 text-center text-white-50">No records available in local SQLite DB.</td></tr>';
                    unsyncedSpan.innerText = '0';
                    return;
                }

                tableBody.innerHTML = '';
                let unsyncedCounter = 0;

                records.forEach(record => {
                    const data = record.data || {};
                    const id = record.id;
                    const isSynced = record.is_synced;

                    if (!isSynced) unsyncedCounter++;

                    let uic = data.uic;
                    if (!uic) {
                        const mCode = (data.mother_code || '').toUpperCase();
                        const fCode = (data.father_code || '').toUpperCase();
                        const bOrder = formatBirthOrder(data.birth_order);
                        const bDate = formatUICDate(data.birth_date);
                        uic = `${mCode}${fCode}${bOrder}${bDate}`;
                    }

                    const syncBadge = isSynced 
                        ? '<span class="badge bg-success">CLOUD SYNCED</span>' 
                        : '<span class="badge bg-warning text-dark">UNSYNCED / OFFLINE</span>';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-4"><input class="form-check-input record-checkbox" type="checkbox" value="${id}"></td>
                        <td class="px-4">${syncBadge}</td>
                        <td class="px-4 font-monospace">${data.test_date || 'N/A'}</td>
                        <td class="px-4 fw-bold text-amber-custom">${uic}</td>
                        <td class="px-4"><span class="badge ${data.linkage_result === 'REACTIVE' ? 'bg-danger' : (data.linkage_result === 'NONREACTIVE' ? 'bg-success' : 'bg-secondary')}">${data.linkage_result || 'PENDING'}</span></td>
                        <td class="px-4 text-end">
                            <a href="/records/${id}/export" target="_blank" class="btn btn-sm btn-outline-warning">Print PDF</a>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });

                unsyncedSpan.innerText = unsyncedCounter;

                const checkboxes = document.querySelectorAll('.record-checkbox');
                function updateCounter() {
                    document.getElementById('selected-count').innerText = document.querySelectorAll('.record-checkbox:checked').length;
                }

                checkboxes.forEach(cb => cb.addEventListener('change', updateCounter));

                document.getElementById('select-all-records').onclick = (e) => {
                    checkboxes.forEach(cb => cb.checked = e.target.checked);
                    updateCounter();
                };

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = '<tr><td colspan="6" class="py-4 text-center text-danger">Failed to load records.</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadRecords();

            // Sync Button Action
            document.getElementById('btn-sync-unpushed').addEventListener('click', async () => {
                if (!navigator.onLine) {
                    alert("Cannot sync: Internet connection unavailable.");
                    return;
                }
                try {
                    const res = await fetch('/api/sqlite/sync-pending', { method: 'POST' });
                    const result = await res.json();
                    alert(`Sync Complete! ${result.synced_count || 0} unsynced records pushed to Firebase.`);
                    loadRecords();
                } catch (err) {
                    alert("Error syncing records with Firebase.");
                }
            });

            // Batch Print Trigger
            document.getElementById('btn-trigger-batch').addEventListener('click', () => {
                const selectedIds = Array.from(document.querySelectorAll('.record-checkbox:checked')).map(cb => cb.value);
                if (selectedIds.length === 0) {
                    alert("Please select at least one record to print.");
                    return;
                }
                window.open(`/records/batch/export?ids=${selectedIds.join(',')}`, '_blank');
            });
        });
    </script>
</body>
</html>
